# /etc/systemd/oomd.conf.d/no-pressure-kill.conf
#
# Stops systemd-oomd killing cgroups on memory pressure. Ghostty opts each
# surface scope into oomd (ManagedOOMMemoryPressure=kill) and we cap those
# scopes with MemoryHigh — but MemoryHigh works BY forcing reclaim, and oomd
# kills on pressure-with-reclaim. The cap manufactures oomd's trigger, and an
# oomd kill takes the whole cgroup (shell included), which DefaultOOMPolicy
# cannot save. See README.md, "Claude Code OOM kills and Ghostty tabs".
#
# Pressure is the fraction of a 10s window in which ALL tasks were delayed, so
# 100% sustained for 20s is unreachable in practice: pressure-kills off, while
# oomd's swap backstop (SwapUsedLimit=90%) and the kernel OOM killer stay on.
[OOM]
DefaultMemoryPressureLimit=100%
