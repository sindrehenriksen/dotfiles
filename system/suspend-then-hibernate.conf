# Make every suspend a suspend-then-hibernate: GNOME only ever asks logind for
# a plain suspend, from the menu, on idle and on lid close.
# Install: sudo mkdir -p /etc/systemd/system/systemd-suspend.service.d
#          sudo cp ~/dotfiles/system/suspend-then-hibernate.conf /etc/systemd/system/systemd-suspend.service.d/then-hibernate.conf
#          sudo systemctl daemon-reload
#
# With HibernateDelaySec unset, systemd arms the battery's own low-charge
# alarm at 5% and sleeps until it fires, so on a charger nothing changes.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-sleep suspend-then-hibernate
