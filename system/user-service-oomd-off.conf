# /etc/systemd/system/user@.service.d/oomd-off.conf
#
# Ubuntu ships ManagedOOMMemoryPressure=kill with a 50% limit on user@.service
# (/usr/lib/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf),
# which makes systemd-oomd kill the heaviest-reclaiming cgroup under the whole
# user session. That is what killed a Ghostty tab on 16 Aug 2026 at 89.32%
# pressure. Turning it off leaves the kernel OOM killer as the last resort —
# it kills ONE process, which DefaultOOMPolicy=continue then survives.
#
# Pairs with oomd-no-pressure-kill.conf, which covers the per-scope limit that
# Ghostty sets directly and this override cannot reach.
[Service]
ManagedOOMMemoryPressure=auto
