# Hibernate at 5% on an awake machine, rather than UPower's default hybrid
# sleep at 2%: any wake from hybrid sleep's suspend half drops the image, and
# UPower acts only once, so the battery then runs flat. Hibernating powers off.
# UPower reads only drop-ins named NN-name.conf.
# Install: sudo mkdir -p /etc/UPower/UPower.conf.d
#          sudo cp ~/dotfiles/system/upower-hibernate.conf /etc/UPower/UPower.conf.d/50-hibernate.conf
#          sudo systemctl restart upower
#
# The thresholds must stay descending from PercentageLow (20.0 in the stock
# UPower.conf), or UPower falls back to its defaults for all of them.
[UPower]
CriticalPowerAction=Hibernate
PercentageCritical=10.0
PercentageAction=5.0
