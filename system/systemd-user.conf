# systemd user manager config, symlinked to ~/.config/systemd/user.conf by
# install_symlinks.sh. Ubuntu's /etc/systemd/user.conf sets nothing but the
# section header, so shadowing it costs nothing.
[Manager]
# Don't tear down a whole unit because one process inside it was OOM-killed.
# Ghostty runs every tab in its own transient scope, so the stock "stop" turns
# "Claude Code was OOM-killed" into "the tab and its scrollback vanished".
# See system/README.md, "Claude Code OOM kills and Ghostty tabs".
DefaultOOMPolicy=continue
