# /etc/tmpfiles.d/pm-trace.conf
#
# Turns on the PM_TRACE resume tracer. Resume from s2idle intermittently hangs
# inside the device-resume phase, where userspace is still frozen and nothing
# reaches disk, so the failure leaves no log at all. PM_TRACE stores a hash of
# the last device resumed in the RTC, which is the only thing that survives
# holding the power button down. README.md, "Display freeze on resume", has how
# to read it back, what it costs and when to take it out again.
#
# A tmpfiles rule rather than a one-shot echo: the failure ends in a power-off,
# so the setting has to re-arm itself or it is never on when it matters.
w /sys/power/pm_trace - - - - 1
